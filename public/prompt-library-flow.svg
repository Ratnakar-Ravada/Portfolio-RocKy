<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="prompt-title prompt-description">
  <title id="prompt-title">Prompt Library: enterprise prompt management platform</title>
  <desc id="prompt-description">Product overview of Prompt Library. Full stack authoring, versioning, sharing, AI Prompt Builder, metadata suggestions, and quality feedback connect to Redis fast-path and hybrid lexical, pgvector, and HyDE retrieval. DeepEval and GEval safety checks, semantic duplicate detection across all versions, and PII/PHI redaction support governance. Authorized public APIs are exposed as MCP tools through AWS AgentCore Gateway. Advanced-user analytics and SSE bulk operations with 500 items per request provide visibility and progress. Okta SSO, OAuth 2.0, JWT, and user/team authorization protect access. Containerized services run on AWS ECS with ALB, autoscaling, Aurora, and GitHub Actions CI/CD.</desc>
  <defs>
    <linearGradient id="prompt-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#eaf0f9"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#prompt-paper)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M64 58h40" stroke="#2356d9" stroke-width="4"/>
    <text x="120" y="66" fill="#2356d9" font-size="23" font-weight="700" letter-spacing="2.5">PROMPT LIBRARY</text>
    <text x="1536" y="66" text-anchor="end" fill="#526178" font-size="20" letter-spacing="1.5">PRODUCT OVERVIEW / ENTERPRISE PLATFORM</text>
    <text x="64" y="132" fill="#14233a" font-size="48" font-weight="600" letter-spacing="-1.5">A shared platform for the prompt lifecycle.</text>
    <text x="64" y="178" fill="#526178" font-size="25">Create, refine, retrieve, and integrate prompts with governed access.</text>
    <path d="M64 211H1536" stroke="#c5d3e7" stroke-width="2"/>

    <rect x="64" y="244" width="420" height="472" fill="#ffffff" stroke="#c5d3e7"/>
    <rect x="510" y="244" width="510" height="472" fill="#e0eafb" stroke="#aebfe0"/>
    <rect x="1046" y="244" width="490" height="472" fill="#ffffff" stroke="#c5d3e7"/>
    <path d="M64 244h420M510 244h510M1046 244h490" stroke="#2356d9" stroke-width="4"/>

    <text x="92" y="285" fill="#2356d9" font-size="21" font-weight="700" letter-spacing="1">01 / AUTHOR + COLLABORATE</text>
    <text x="92" y="335" fill="#14233a" font-size="31" font-weight="600">A prompt workspace.</text>
    <text x="92" y="378" fill="#526178" font-size="24">Create, edit, and manage.</text>
    <text x="92" y="414" fill="#526178" font-size="24">Version, share, and collaborate.</text>
    <path d="M92 448H456" stroke="#c5d3e7"/>
    <text x="92" y="494" fill="#14233a" font-size="29" font-weight="600">AI Prompt Builder</text>
    <text x="92" y="536" fill="#526178" font-size="24">Intelligent tag + metadata</text>
    <text x="92" y="570" fill="#526178" font-size="24">suggestions and refinement.</text>
    <text x="92" y="624" fill="#526178" font-size="24">Quality analysis with</text>
    <text x="92" y="658" fill="#526178" font-size="24">actionable improvement feedback.</text>

    <text x="538" y="285" fill="#2356d9" font-size="21" font-weight="700" letter-spacing="1">02 / RETRIEVE + PROTECT</text>
    <text x="538" y="335" fill="#14233a" font-size="31" font-weight="600">Relevant retrieval.</text>
    <text x="538" y="378" fill="#526178" font-size="24">Redis fast-path lookup</text>
    <text x="538" y="414" fill="#526178" font-size="24">Weighted lexical + pgvector + HyDE</text>
    <path d="M538 448H992" stroke="#aebfe0"/>
    <text x="538" y="494" fill="#14233a" font-size="29" font-weight="600">Safety at the prompt level.</text>
    <text x="538" y="536" fill="#526178" font-size="24">DeepEval / GEval security checks</text>
    <text x="538" y="570" fill="#526178" font-size="24">Injection, jailbreak, adversarial, toxic</text>
    <text x="538" y="624" fill="#526178" font-size="24">Sentence-level duplicates: all versions</text>
    <text x="538" y="658" fill="#526178" font-size="24">PII/PHI redaction under Cigna policy</text>

    <text x="1074" y="285" fill="#2356d9" font-size="21" font-weight="700" letter-spacing="1">03 / INTEGRATE + OBSERVE</text>
    <text x="1074" y="335" fill="#14233a" font-size="31" font-weight="600">Prompts beyond the UI.</text>
    <text x="1074" y="378" fill="#526178" font-size="24">Public APIs + MCP server tools</text>
    <text x="1074" y="414" fill="#526178" font-size="24">Behind AWS AgentCore Gateway</text>
    <path d="M1074 448H1508" stroke="#c5d3e7"/>
    <text x="1074" y="494" fill="#14233a" font-size="29" font-weight="600">Visibility and bulk work.</text>
    <text x="1074" y="536" fill="#526178" font-size="24">Usage + LLM consumption analytics</text>
    <text x="1074" y="570" fill="#526178" font-size="24">Detailed filters, advanced-user access</text>
    <text x="1074" y="624" fill="#2356d9" font-size="29" font-weight="600">500 items per request</text>
    <text x="1074" y="658" fill="#526178" font-size="24">SSE progress + heartbeats</text>

    <rect x="64" y="754" width="1472" height="172" fill="#14233a"/>
    <text x="94" y="793" fill="#dff08a" font-size="20" font-weight="700" letter-spacing="1.5">SECURE ACCESS</text>
    <text x="94" y="837" fill="#ffffff" font-size="28" font-weight="600">Okta SSO / OAuth 2.0 / JWT</text>
    <text x="94" y="882" fill="#c7d7ee" font-size="24">Authorization at user + team level</text>
    <path d="M768 785V897" stroke="#40516b"/>
    <text x="800" y="793" fill="#dff08a" font-size="20" font-weight="700" letter-spacing="1.5">AWS DELIVERY</text>
    <text x="800" y="837" fill="#ffffff" font-size="28" font-weight="600">ECS + ALB + autoscaling</text>
    <text x="800" y="882" fill="#c7d7ee" font-size="24">Aurora + GitHub Actions CI/CD</text>
    <text x="64" y="971" fill="#526178" font-size="23">Python / FastAPI / React / TypeScript / PostgreSQL + Aurora</text>
    <text x="1536" y="971" text-anchor="end" fill="#2356d9" font-size="23">Iterative load + stress testing</text>
  </g>
</svg>
