<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="expensia-title expensia-description">
  <title id="expensia-title">Expensia: agentic expense claims automation</title>
  <desc id="expensia-description">Product overview of the full Expensia application. It addresses manual reimbursement, fragmented evidence, and delayed policy or fraud checks. LangGraph supervisor-led agents extract receipts, validate policy, detect anomalies, and support claim decisions. RAG retrieves policies and Image RAG compares receipt similarity for grounded fraud assessments. Vendor APIs and public forums corroborate claim details. A RAG policy chatbot guides claim submission, eligibility, and resolution. LangSmith tracing, risk flags, and suspicious-run handling support observability. Results supplied for this project are 90 percent automated claims processing, 10 percent human-in-the-loop review with reasons and risk flags, and 94 percent fraudulent-claim detection.</desc>
  <defs>
    <linearGradient id="expensia-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#eaf0f9"/></linearGradient>
    <pattern id="expensia-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#expensia-paper)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M64 58h40" stroke="#2356d9" stroke-width="4"/>
    <text x="120" y="66" fill="#2356d9" font-size="23" font-weight="700" letter-spacing="2.5">EXPENSIA</text>
    <text x="1536" y="66" text-anchor="end" fill="#526178" font-size="20" letter-spacing="1.5">PRODUCT OVERVIEW / FULL APPLICATION</text>
    <text x="64" y="132" fill="#14233a" font-size="48" font-weight="600" letter-spacing="-1.5">Expense claims, with the evidence in view.</text>
    <text x="64" y="178" fill="#526178" font-size="25">Connect the receipt, the policy, and external evidence to a clear decision.</text>
    <path d="M64 211H1536M64 831H1536" stroke="#c5d3e7" stroke-width="2"/>

    <rect x="64" y="244" width="350" height="553" fill="#14233a"/>
    <rect x="64" y="244" width="350" height="553" fill="url(#expensia-grid)"/>
    <rect x="64" y="244" width="4" height="553" fill="#2356d9"/>
    <text x="92" y="286" fill="#dff08a" font-size="21" font-weight="700" letter-spacing="1.5">THE PROBLEM</text>
    <text x="92" y="334" fill="#ffffff" font-size="32" font-weight="600">Too many loose</text>
    <text x="92" y="373" fill="#ffffff" font-size="32" font-weight="600">ends in one claim.</text>
    <path d="M92 402H386M92 522H386M92 642H386" stroke="#40516b"/>
    <text x="92" y="446" fill="#ffffff" font-size="25" font-weight="600">Manual reimbursement</text>
    <text x="92" y="483" fill="#bacbe3" font-size="24">Checks and follow-ups</text>
    <text x="92" y="515" fill="#bacbe3" font-size="24">slow claim processing.</text>
    <text x="92" y="566" fill="#ffffff" font-size="25" font-weight="600">Fragmented evidence</text>
    <text x="92" y="603" fill="#bacbe3" font-size="24">Claim context sits apart</text>
    <text x="92" y="635" fill="#bacbe3" font-size="24">from supporting sources.</text>
    <text x="92" y="686" fill="#ffffff" font-size="25" font-weight="600">Delayed risk checks</text>
    <text x="92" y="723" fill="#bacbe3" font-size="24">Policy violations and fraud</text>
    <text x="92" y="755" fill="#bacbe3" font-size="24">need contextual review.</text>

    <text x="450" y="266" fill="#2356d9" font-size="21" font-weight="700" letter-spacing="1.5">HOW EXPENSIA HELPS</text>
    <rect x="450" y="288" width="1086" height="94" fill="#ffffff" stroke="#c5d3e7"/>
    <text x="478" y="344" fill="#2356d9" font-size="34">01</text>
    <text x="550" y="326" fill="#14233a" font-size="29" font-weight="600">Bring the claim together.</text>
    <text x="550" y="363" fill="#526178" font-size="24">Capture claim details and extract receipt information.</text>
    <path d="M993 383v20m-7-7 7 7 7-7" fill="none" stroke="#8aa5ce" stroke-width="2"/>

    <rect x="450" y="414" width="1086" height="183" fill="#dfe9fa" stroke="#aebfe0"/>
    <text x="478" y="452" fill="#2356d9" font-size="22" font-weight="700" letter-spacing="1">02 / GROUND THE REVIEW IN EVIDENCE</text>
    <rect x="478" y="474" width="492" height="99" fill="#2356d9"/>
    <rect x="994" y="474" width="514" height="99" fill="#14233a"/>
    <text x="502" y="516" fill="#ffffff" font-size="34" font-weight="600">RAG</text>
    <text x="502" y="552" fill="#eef4ff" font-size="24">Policy retrieval for grounded checks.</text>
    <text x="1018" y="516" fill="#dff08a" font-size="34" font-weight="600">Image RAG</text>
    <text x="1018" y="552" fill="#d6e4f7" font-size="24">Receipt similarity + fraud evidence.</text>
    <path d="M993 598v20m-7-7 7 7 7-7" fill="none" stroke="#8aa5ce" stroke-width="2"/>

    <rect x="450" y="628" width="1086" height="116" fill="#ffffff" stroke="#c5d3e7"/>
    <text x="478" y="688" fill="#2356d9" font-size="34">03</text>
    <text x="550" y="665" fill="#14233a" font-size="29" font-weight="600">Validate, decide, and route.</text>
    <text x="550" y="702" fill="#526178" font-size="24">LangGraph supervisor: extraction, policy, anomaly, and decision agents.</text>
    <text x="550" y="733" fill="#526178" font-size="24">Vendor APIs + public forums corroborate details; exceptions reach HITL.</text>
    <text x="450" y="784" fill="#526178" font-size="24">RAG policy chatbot  /  LangSmith tracing  /  Risk flags + suspicious-run handling</text>

    <text x="64" y="869" fill="#2356d9" font-size="20" font-weight="700" letter-spacing="1.5">RESULTS</text>
    <text x="64" y="926" fill="#14233a" font-size="51" font-weight="600">90%</text>
    <text x="64" y="967" fill="#526178" font-size="24">Automated claims processing</text>
    <path d="M532 870V976M1034 870V976" stroke="#c5d3e7"/>
    <text x="570" y="926" fill="#14233a" font-size="51" font-weight="600">10%</text>
    <text x="570" y="967" fill="#526178" font-size="24">HITL with reasons + risk flags</text>
    <text x="1072" y="926" fill="#14233a" font-size="51" font-weight="600">94%</text>
    <text x="1072" y="967" fill="#526178" font-size="24">Fraudulent-claim detection</text>
  </g>
</svg>
